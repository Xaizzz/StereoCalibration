<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420">
  <title>StereoCalibration: controllers and services</title>
  <desc>Minimal call graph: live video, stereo calibration, 3D scene, WPF viewport.</desc>
  <style>
    text { font-family: "Segoe UI", system-ui, sans-serif; fill: #111; }
    .box { fill: #fff; stroke: #222; stroke-width: 1.2; rx: 3; ry: 3; }
    .zone { fill: none; stroke: #888; stroke-width: 1; stroke-dasharray: 6 4; rx: 8; ry: 8; }
    .cap { font-size: 11px; fill: #555; letter-spacing: 0.04em; }
    .lbl { font-size: 12px; }
    .sml { font-size: 10px; fill: #333; }
    .arr { stroke: #222; stroke-width: 1; fill: none; marker-end: url(#mh); }
    .arr-d { stroke: #666; stroke-width: 1; fill: none; stroke-dasharray: 5 5; marker-end: url(#mh); }
  </style>
  <defs>
    <marker id="mh" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0, 7 3.5, 0 7" fill="#222"/>
    </marker>
  </defs>

